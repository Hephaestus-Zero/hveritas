name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Pytest suite
        run: pytest -q -m "not docker_e2e"
